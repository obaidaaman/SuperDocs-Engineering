[project]
name = "analyst-backend"
version = "0.1.0"
description = "The Analyst That Never Sleeps — agentic document analysis backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    # Database
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "alembic==1.15.2",
    "pgvector==0.3.6",
    # Auth
    "pyjwt==2.10.1",
    "bcrypt==4.3.0",
    "python-multipart==0.0.20",
    # Configuration
    "pydantic-settings==2.9.1",
    # Document Parsing
    "pdfplumber==0.11.6",
    "python-docx==1.1.2",
    # LLM + Embeddings
    "openai==1.82.0",
    "langchain-openai==0.3.18",
    "langgraph==0.4.7",
    "langgraph-checkpoint-postgres==2.0.18",
    # Rate Limiting
    "slowapi==0.1.9",
    # Logging
    "structlog==25.1.0",
    # Utilities
    "python-dotenv==1.1.0",
    "pytest==8.3.5",
    "pytest-asyncio==0.25.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "httpx>=0.28.1",
]
