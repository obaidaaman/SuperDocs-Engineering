services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vendor_analyst_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analyst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyst_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vendor_analyst}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analyst} -d ${POSTGRES_DB:-vendor_analyst}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
